# Checks external links in source files changed by a pull request.
# Only scans files touched in the PR because this is a speedy boi.

name: Check external links (changed files)

on:
  pull_request:
    paths:
      - 'astro/src/**/*.md'
      - 'astro/src/**/*.mdx'
      - 'astro/src/**/*.astro'

jobs:
  check:
    name: Check external links in changed files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Find changed source files
        id: changed
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -E '\.(md|mdx|astro)$' \
            | grep '^astro/src/' \
            > /tmp/changed-files.txt || true
          if [ -s /tmp/changed-files.txt ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "Changed source files:"
            cat /tmp/changed-files.txt
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No source files changed."
          fi

      - name: Check external links
        if: steps.changed.outputs.has_files == 'true'
        run: |
          mapfile -t files < /tmp/changed-files.txt
          src/scripts/check-external-links.py \
            "${files[@]}" \
            --workers 25 \
            --concurrency 3 \
            --rate-limit 500 \
            --timeout 20
