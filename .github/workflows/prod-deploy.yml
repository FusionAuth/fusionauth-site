name: (prod) Astro deployment
env:
  BUCKET_NAME: "fusionauth-io-website-astro-2023"
  PUBLISHER_ROLE_ARN: "${{ secrets.PUBLISHER_ROLE_ARN }}"
  AWS_REGION: "us-east-1"
on:
  push:
    branches:
      - main
    paths:
      - 'astro/**'
      - '.github/workflows/prod-deploy.yml'

  workflow_dispatch:

permissions:
  id-token: write # OIDC to assume the AWS role
  contents: read

# queue deploys; never cancel one mid-flight
concurrency:
  group: "deploy-prod"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest-8-core-32-gb
    defaults:
      run:
        working-directory: ./astro
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'astro/package-lock.json'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: astro/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('astro/package-lock.json') }}

      # keyed on the generator too, so a package upgrade or option change can't restore stale output
      - name: Cache generated code snippets
        uses: actions/cache@v6
        with:
          path: astro/src/generated-code-snippets
          key: ${{ runner.os }}-snippets-${{ hashFiles('astro/extractedcode/**', 'astro/package-lock.json', 'astro/astro.config.ts', 'astro/bluehawk-languages.js') }}

      - name: Cache remote content fetches
        uses: actions/cache@v6
        with:
          path: astro/.content-cache
          # a fixed key is never overwritten, so key on the run to save each build's fetch; restore the newest earlier one
          key: content-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: content-cache-${{ runner.os }}-

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PUBLISHER_ROLE_ARN }}
          role-session-name: site_publisher_session
          aws-region: ${{ env.AWS_REGION }}

      - name: Install modules
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build application
        run: NODE_OPTIONS=--max_old_space_size=8192 npm run build
        env:
          PROD: 'true'

      - name: Deploy to S3
        run: |
          aws configure set default.s3.max_concurrent_requests 100
          aws configure set default.s3.max_queue_size 10000
          aws s3 sync ./dist/ s3://${{ env.BUCKET_NAME }} --delete
          aws s3 sync ./cdn/ s3://${{ env.BUCKET_NAME }}/cdn/

      - name: CloudFront request handler and cache invalidation
        working-directory: .
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.DISTRIBUTION_ID }} --paths "/*"
