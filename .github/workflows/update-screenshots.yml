name: Update screenshots

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      threshold:
        description: differing-pixel ratio that counts as a real change
        required: false
        default: '0.002'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            astro/package-lock.json
            astro/screenshots/package-lock.json

      - name: Install site modules
        run: npm ci
        working-directory: ./astro

      - name: Install screenshots CLI
        run: npm ci
        working-directory: ./astro/screenshots

      - name: Install Playwright webkit
        run: npx playwright install webkit --with-deps
        working-directory: ./astro/screenshots

      # script exits 0 when unchanged, 2 when there's something to review, else failed
      - name: Regenerate and compare
        id: refresh
        run: |
          set +e
          src/scripts/refresh-screenshots.sh --threshold "${{ inputs.threshold || '0.002' }}"
          status=$?
          set -e
          if [ "$status" -gt 2 ]; then exit "$status"; fi
          if [ "$status" -eq 1 ]; then exit 1; fi
          echo "changed=$([ "$status" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          FUSIONAUTH_LICENSE_KEY: ${{ secrets.FUSIONAUTH_LICENSE_KEY }}

      - name: Upload diff images
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: astro/.screenshot-diffs/
          if-no-files-found: ignore

      - name: Open PR with updated screenshots
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="screenshots/auto-update-$(date +%Y-%m-%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add astro/public/img/docs/screenshots/
          git commit -m "chore: update screenshots $(date +%Y-%m-%d)"
          git push origin "$BRANCH"

          FILES=$(git diff --name-only HEAD~1 HEAD | sed 's|.*/||' | sed 's/^/- /')
          gh pr create \
            --title "chore: update screenshots $(date +%Y-%m-%d)" \
            --body "Weekly screenshot refresh. Only images whose pixel diff exceeded the tolerance are included; anything within tolerance was reverted to the committed version.

          ### Changed

          ${FILES}

          Diff images are attached to this workflow run as the \`screenshot-diffs\` artifact." \
            --label "screenshots" \
            --base main

      - name: No changes
        if: steps.refresh.outputs.changed == 'false'
        run: echo "All screenshots within tolerance -- no PR needed."

  report:
    needs: update
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/report-scheduled-run.yml
    with:
      result: ${{ needs.update.result }}
    permissions:
      contents: read
      issues: write
