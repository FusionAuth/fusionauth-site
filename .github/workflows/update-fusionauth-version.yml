name: Update FusionAuth version

on:
  schedule:
    - cron: '17 9 */2 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      # pins fusionauth-version and its copies; sets `version` only when it changed something
      - name: Pin latest FusionAuth release
        id: bump
        run: bash scripts/update_fusionauth_version.sh

      # one PR per version; a closed one means someone already decided, so don't reopen it
      - name: Check for an existing PR
        id: existing
        if: steps.bump.outputs.version
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="automation/fusionauth-$VERSION"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          count=$(gh pr list --head "$branch" --state all --json number --jq length)
          echo "found=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then echo "A PR for FusionAuth $VERSION already exists."; fi

      - name: Open PR
        if: steps.existing.outputs.found == 'false'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.existing.outputs.branch }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add fusionauth-version astro/public/docs/docker-compose.yml astro/screenshots/docker-compose.yml
          git commit -m "chore: pin FusionAuth $VERSION"
          git push --force origin "$BRANCH"

          {
            printf 'Pins FusionAuth %s in `fusionauth-version`, which the API, template, and external content checks read, and in its copies: the Docker install compose file (`astro/public/docs/docker-compose.yml`, served at /docs/docker-compose.yml) and the screenshot tooling (`astro/screenshots/docker-compose.yml`).\n\n' "$VERSION"
            printf '### Changes\n\n```diff\n'
            git diff HEAD~1 HEAD
            printf '```\n\nMerge this PR after the docs for %s are on `main`. The API docs check in the Shakedown build runs against %s on this PR, so it fails until they are. See "Update the docs for a new FusionAuth release" in the README.\n\n' "$VERSION" "$VERSION"
            printf '### Reproduce locally\n\nRun this from the repo root:\n\n```bash\nFUSIONAUTH_VERSION=%s bash scripts/update_fusionauth_version.sh\n```\n' "$VERSION"
          } > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md"

          # a branch without its PR would leave the failure issue pointing at an orphan
          if ! gh pr create --base main --head "$BRANCH" \
            --title "chore: pin FusionAuth $VERSION" --body-file "$RUNNER_TEMP/pr-body.md"; then
            git push origin --delete "$BRANCH"
            exit 1
          fi

          # PRs opened with GITHUB_TOKEN don't trigger pull_request workflows, but a dispatch does
          gh workflow run test-build.yml --ref "$BRANCH"

  report:
    needs: update
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/report-scheduled-run.yml
    with:
      result: ${{ needs.update.result }}
    permissions:
      contents: read
      issues: write
