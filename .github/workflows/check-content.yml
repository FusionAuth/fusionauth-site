name: check-content
on: 
  pull_request:
  workflow_dispatch:

# a new push to the PR cancels the run for the old commit, freeing its runner slots
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check_content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Check for blog posts that have incorrect categories
        run: src/scripts/check-for-incorrect-categories.sh
        shell: bash
      - name: No absolute URLs referencing FusionAuth.io
        run: src/scripts/check-for-absolute-urls.sh
        shell: bash
      - name: check for APIFields with no name
        run: src/scripts/check-for-api-fields-no-name.sh
        shell: bash
