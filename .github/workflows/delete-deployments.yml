name: Delete deployments (temporary)

# one-off cleanup of leftover preview deployments; delete this workflow once it has run
on:
  workflow_dispatch:
    inputs:
      delete:
        description: delete the deployments (leave unchecked to only list them)
        type: boolean
        default: false

permissions:
  deployments: write

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DELETE: ${{ inputs.delete }}
    steps:
      - name: List or delete every deployment
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/deployments?per_page=100" \
            --jq '.[] | "\(.id)\t\(.environment)\t\(.created_at)"' > deployments.tsv
          echo "Found $(wc -l < deployments.tsv) deployment(s)."

          if [ "$DELETE" != "true" ]; then
            cat deployments.tsv
            echo "Dry run, nothing deleted. Run again with delete checked to remove them."
            exit 0
          fi

          deleted=0
          failed=0
          while IFS=$'\t' read -r id environment _; do
            # GitHub won't delete an active deployment, so mark it inactive first
            if gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive --silent \
              && gh api -X DELETE "repos/$REPO/deployments/$id" --silent; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
              echo "Failed to delete deployment $id ($environment)"
            fi
            sleep 0.3
          done < deployments.tsv

          echo "Deleted $deleted, failed $failed."
          [ "$failed" -eq 0 ]
