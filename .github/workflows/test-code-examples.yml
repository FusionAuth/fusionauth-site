name: Test localcode

on:
  pull_request:
    paths:
      - 'astro/localcode/**'
  workflow_dispatch:

jobs:
  discover:
    name: Discover test suites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - id: scan
        name: Scan for localcode test suites
        run: |
          set -euo pipefail
          missing=()
          dirs=()
          for dir in astro/localcode/*/; do
            name=$(basename "$dir")
            if [ ! -f "${dir}tests/test.sh" ]; then
              missing+=("$name")
            else
              dirs+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'ERROR: localcode directory missing tests/test.sh: %s\n' "${missing[@]}" >&2
            exit 1
          fi
          matrix=$(printf '%s\n' "${dirs[@]}" | jq -R . | jq -sc .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Found ${#dirs[@]} test suite(s): ${dirs[*]}"

  test:
    name: Test ${{ matrix.localcode }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        localcode: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.localcode }}-${{ hashFiles(format('astro/localcode/{0}/**/Cargo.toml', matrix.localcode)) }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: bash tests/test.sh
        working-directory: astro/localcode/${{ matrix.localcode }}
