name: Test code examples

on:
  pull_request:
    paths:
      - 'astro/localcode/**'
  workflow_dispatch:

jobs:
  test:
    name: Test code examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('astro/localcode/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run all code example tests
        run: bash src/scripts/test-code-examples.sh
