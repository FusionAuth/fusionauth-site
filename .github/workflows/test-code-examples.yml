name: Test extractedcode

on:
  pull_request:
    paths:
      - 'astro/extractedcode/**'
      - 'src/scripts/fetch_external_content.sh'
      - 'src/scripts/tests/test_fetch_external_content.py'
      - '.github/workflows/check-external-content.yml'
      - '.github/workflows/test-code-examples.yml'
  workflow_dispatch:

# a new push to the PR cancels the run for the old commit, freeing its runner slots
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    name: Discover changed test suites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      macos_matrix: ${{ steps.scan.outputs.macos_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: scan
        name: Scan for changed extractedcode test suites
        run: |
          set -euo pipefail

          # templates-* directories hold static reference files that the docs
          # render and readers download. There is no project to run, so they are
          # exempt from the tests/test.sh requirement and from the matrix below.
          is_templates() { case "$1" in templates-*) return 0;; *) return 1;; esac; }

          # Validate every other extractedcode dir has tests/test.sh
          for dir in astro/extractedcode/*/; do
            name=$(basename "$dir")
            is_templates "$name" && continue
            if [ ! -f "${dir}tests/test.sh" ]; then
              echo "ERROR: extractedcode directory missing tests/test.sh: $name" >&2
              exit 1
            fi
          done

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger: test all suites
            dirs=()
            for dir in astro/extractedcode/*/; do
              name=$(basename "$dir")
              is_templates "$name" && continue
              dirs+=("$name")
            done
          else
            # PR: only test suites whose files changed
            git fetch origin "${{ github.base_ref }}" --depth=1
            dirs=()
            for dir in astro/extractedcode/*/; do
              name=$(basename "$dir")
              is_templates "$name" && continue
              if ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- "astro/extractedcode/$name/"; then
                dirs+=("$name")
              elif [ "$name" = "configuration-snippets" ] &&
                ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- \
                  src/scripts/fetch_external_content.sh \
                  src/scripts/tests/test_fetch_external_content.py \
                  .github/workflows/check-external-content.yml \
                  .github/workflows/test-code-examples.yml; then
                # Refresh tooling lives outside its extractedcode suite.
                dirs+=("$name")
              fi
            done
          fi

          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "No extractedcode directories changed"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "macos_matrix=[]" >> "$GITHUB_OUTPUT"
          else
            matrix=$(printf '%s\n' "${dirs[@]}" | jq -R . | jq -sc .)
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo "Suites to test: ${dirs[*]}"

            # iOS apps only build on macOS, so suites with tests/macos.sh also get a macOS runner
            macos_dirs=()
            for name in "${dirs[@]}"; do
              [ -f "astro/extractedcode/$name/tests/macos.sh" ] && macos_dirs+=("$name")
            done
            if [ "${#macos_dirs[@]}" -eq 0 ]; then
              echo "macos_matrix=[]" >> "$GITHUB_OUTPUT"
            else
              macos_matrix=$(printf '%s\n' "${macos_dirs[@]}" | jq -R . | jq -sc .)
              echo "macos_matrix=$macos_matrix" >> "$GITHUB_OUTPUT"
              echo "Suites to build on macOS: ${macos_dirs[*]}"
            fi
          fi

  test:
    name: Test ${{ matrix.extractedcode }}
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      # leaves runner slots for other PR workflows (including Preview) when many examples change
      max-parallel: 8
      matrix:
        extractedcode: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.extractedcode }}-${{ hashFiles(format('astro/extractedcode/{0}/**/Cargo.toml', matrix.extractedcode)) }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: bash tests/test.sh
        working-directory: astro/extractedcode/${{ matrix.extractedcode }}
        env:
          # examples that need a paid plan write this into a temporary kickstart; fork PRs get no secrets and skip those checks
          FUSIONAUTH_LICENSE_KEY: ${{ secrets.FUSIONAUTH_LICENSE_KEY }}

  test-macos:
    name: Test ${{ matrix.extractedcode }} on macOS
    needs: discover
    if: ${{ needs.discover.outputs.macos_matrix != '[]' }}
    runs-on: macos-latest
    strategy:
      matrix:
        extractedcode: ${{ fromJson(needs.discover.outputs.macos_matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        run: bash tests/macos.sh
        working-directory: astro/extractedcode/${{ matrix.extractedcode }}
