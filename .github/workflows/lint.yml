name: lint changed files, build site, check APIs for completeness
env:
    BASE_REF: origin/${{ github.base_ref }}
on:
  pull_request:
  workflow_dispatch:

jobs:
  run_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0 # needed for git diff ...merge-base against base branch in lint-recent-files.mjs

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'astro/package-lock.json'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: astro/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('astro/package-lock.json') }}

      - name: Cache generated code snippets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: astro/src/generated-code-snippets
          key: ${{ runner.os }}-snippets-${{ hashFiles('astro/localcode/**') }}

      - name: Cache remote content fetches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: astro/.content-cache
          key: content-cache-${{ runner.os }}
          restore-keys: content-cache-

      - name: NPM Install
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          cd astro
          npm ci
        shell: bash

      - name: ESLint
        run: |
          cd astro
          npm run lint-pr
        shell: /usr/bin/bash -e -o pipefail {0}

      - name: Run a dev build
        run: |
          cd astro
          NODE_OPTIONS=--max_old_space_size=8192 npm run dev-build
        shell: /usr/bin/bash -e -o pipefail {0}

      - name: Check APIs for completeness against client libs
        run: |
          tagver=`curl --silent https://account.fusionauth.io/api/version -o - | jq 'last(.versions[-1])'|sed 's/"//g'`
          git clone --depth 1 --branch $tagver https://github.com/fusionauth/fusionauth-client-builder
          src/check-apis-against-client-json.rb -f $PWD/src/.checkapis.yaml -c $PWD/fusionauth-client-builder -v --pr
        shell: bash
