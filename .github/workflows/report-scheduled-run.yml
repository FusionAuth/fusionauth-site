name: Report scheduled run

# called by scheduled workflows; keeps one issue open per failing workflow
on:
  workflow_call:
    inputs:
      result:
        required: true
        type: string
      # what failed, in a sentence or two; the issue and its comments quote it
      details:
        required: false
        type: string
        default: ''

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/CODEOWNERS
            scripts/report-scheduled-run.sh
          sparse-checkout-cone-mode: false

      - name: Open, update, or close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.workflow }}
          DETAILS: ${{ inputs.details }}
        run: bash scripts/report-scheduled-run.sh "${{ inputs.result }}"
