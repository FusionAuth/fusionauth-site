# Checks nightly whether the default email and message templates that ship with FusionAuth
# have changed, and fails with a diff if they have so a human can open a PR.
#
# All logic lives in src/scripts/update-templates.sh, which runs the same way locally:
#
#   src/scripts/update-templates.sh all --dry-run     # report without touching the repo
#   src/scripts/update-templates.sh messengers        # refresh just the message templates
#
# Set FUSIONAUTH_APP_ZIP to a downloaded release zip to skip the ~83MB fetch while iterating.

name: Update Templates

on:
  schedule:
    - cron: '37 19 * * *'
  workflow_dispatch:

jobs:
  update:
    name: Check email and message templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: src/scripts/update-templates.sh all
