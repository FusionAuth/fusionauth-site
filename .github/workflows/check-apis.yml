name: Check API docs against client libraries

on:
  schedule:
    - cron: '31 8 * * 1'
  workflow_dispatch:

jobs:
  check_apis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Check APIs for completeness against client libs
        run: bash src/scripts/check-apis.sh

  report:
    needs: check_apis
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/report-scheduled-run.yml
    with:
      result: ${{ needs.check_apis.result }}
    permissions:
      contents: read
      issues: write
