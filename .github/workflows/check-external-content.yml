name: Check External Content & Generated JSON

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Required for compiling and running the JSON generators
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Check for upstream changes
        run: bash src/scripts/fetch_external_content.sh --check