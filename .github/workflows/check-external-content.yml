name: Check external content

on:
  schedule:
    - cron: '23 8 * * 1' # Every Monday at 08:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Check configuration snapshots for upstream changes
        run: bash src/scripts/fetch_external_content.sh --check
