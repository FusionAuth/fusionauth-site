name: Clean Up Copilot Spam

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  sweep-spam:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Copilot to finish processing
        # Give Copilot time to analyze the PR and post its failure review
        run: sleep 30

      - name: Scan and dismiss Copilot spam
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Scanning PR #$PR_NUMBER for Copilot spam..."

          # Fetch all reviews for this PR
          REVIEWS=$(gh api "/repos/$REPO/pulls/$PR_NUMBER/reviews")

          # Find the IDs of any reviews authored by Copilot that contain the spam text
          # (Using jq to safely parse the JSON response)
          SPAM_REVIEW_IDS=$(echo "$REVIEWS" | jq -r '
            .[] | 
            select(.user.login | ascii_downcase | contains("copilot")) | 
            select(.body | test("Copilot wasn'\''t able to review|could not review"; "i")) | 
            .id
          ')

          if [[ -z "$SPAM_REVIEW_IDS" ]]; then
            echo "No Copilot spam found. Exiting."
            exit 0
          fi

          echo "Found spam review(s): $SPAM_REVIEW_IDS"

          # Loop through found spam reviews and dismiss them
          for ID in $SPAM_REVIEW_IDS; do
            echo "Dismissing review $ID..."
            gh api -X PUT "/repos/$REPO/pulls/$PR_NUMBER/reviews/$ID/dismissals" \
              -f message="Automated cleanup: Copilot spam removed" --silent || true
            
            # Note: We skip the GraphQL minimization here because dismissing a 
            # review entirely collapses it and removes the "Changes requested" block.
            echo "✅ Review $ID dismissed."
          done