name: Delete Copilot Spam Comments

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write

jobs:
  delete-spam:
    runs-on: ubuntu-latest
    # apply to only the MS-internal Copilot system actors OR any matching [bot] integration
    if: >-
      github.actor == 'Copilot' ||
      github.actor == 'copilot-pull-request-reviewer' ||
      (contains(github.actor, 'copilot') && endsWith(github.actor, '[bot]'))
    steps:
      - name: Delete Bot Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_URL: ${{ github.event.comment.url || format('/repos/{0}/pulls/{1}/reviews/{2}', github.repository, github.event.pull_request.number, github.event.review.id) }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body }}
          COMMENTER_TYPE: ${{ github.event.comment.user.type || github.event.review.user.type }}
        run: |
          echo "Triggered by actor: ${{ github.actor }}"
          
          # abort if the user type is a human "User", UNLESS it is the exact reserved Copilot actor 
          # (because the internal Copilot actor sometimes returns weird metadata)
          if [[ "$COMMENTER_TYPE" == "User" && "${{ github.actor }}" != "Copilot" && "${{ github.actor }}" != "copilot-pull-request-reviewer" ]]; then
            echo "Safety abort: The comment author is a human 'User'. Protecting human comment."
            exit 0
          fi

          # ensure we actually have a URL before trying to delete
          if [[ -z "$COMMENT_URL" || "$COMMENT_URL" == *"/reviews/" ]]; then
             echo "Error: Could not resolve a valid comment or review URL."
             exit 0
          fi

          # verify the comment body matches the specific Copilot spam error string
          if [[ "$COMMENT_BODY" == *"Copilot wasn't able to review"* || "$COMMENT_BODY" == *"could not review"* ]]; then
            echo "Copilot spam detected. Deleting at $COMMENT_URL..."
            gh api -X DELETE "$COMMENT_URL"
            echo "Deletion successful."
          else
            echo "Comment did not match spam criteria. Skipping."
          fi