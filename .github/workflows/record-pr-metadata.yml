name: Record PR Metadata

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Save PR metadata
        run: |
          mkdir -p pr-metadata
          echo "${{ github.event.pull_request.number }}" > pr-metadata/pr
          echo "${{ github.event.pull_request.head.sha }}" > pr-metadata/sha
          echo "${{ github.head_ref }}" > pr-metadata/branch
          echo "${{ github.event.action }}" > pr-metadata/action
          
      - uses: actions/upload-artifact@v4
        with:
          name: pr-metadata
          path: pr-metadata/
