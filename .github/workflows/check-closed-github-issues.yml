name: Check for closed GitHub issues in docs

on:
  schedule:
    - cron: '31 8 * * 1'
  workflow_dispatch:

jobs:
  check_closed_github_issues:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for closed issues referenced in documentation
        run: src/scripts/check-for-closed-github-issues-in-docs.sh
        shell: bash

  report:
    needs: check_closed_github_issues
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/report-scheduled-run.yml
    with:
      result: ${{ needs.check_closed_github_issues.result }}
    permissions:
      contents: read
      issues: write
