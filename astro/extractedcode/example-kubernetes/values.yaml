# :snippet-start: replicas
# replicaCount -- The number of fusionauth-app instances to run
replicaCount: 1
# :snippet-end:

# :snippet-start: database
database:
  host: "<database-host>"
  port: 5432
  protocol: postgresql
  tls: true
  tlsMode: require
  name: fusionauth

  dbUser:
    username: fusionauth
    existingSecret:
      enabled: true
      name: fusionauth-db-credentials
      passwordKey: password

  rootUser:
    username: "<superuser-name>"
    existingSecret:
      enabled: true
      name: fusionauth-db-root-credentials
      passwordKey: password
# :snippet-end:

# :snippet-start: search
search:
  engine: elasticsearch
  protocol: https
  host: "<search-host>"
  port: 9200
  basicAuth:
    existingSecret:
      enabled: true
      name: fusionauth-search-credentials
      userKey: username
      passwordKey: password
# :snippet-end:

# :snippet-start: app
app:
  runtimeMode: production
  silentMode: true
# :snippet-end:

# :snippet-start: gateway
gateway:
  enabled: true
  parentRefs:
    - name: fusionauth-gateway
      sectionName: https
  hostnames:
    - auth.example.com
# :snippet-end:
