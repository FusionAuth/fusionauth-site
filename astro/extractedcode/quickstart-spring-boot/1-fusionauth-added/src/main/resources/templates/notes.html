<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Notes</title>
</head>
<body>
    <h1>Notes</h1>
    <form method="post" th:action="@{/}">
        <label for="content">Your note</label><br>
        <textarea id="content" name="content" rows="8" cols="40" th:text="${content}"></textarea><br>
        <button type="submit">Save Changes</button>
    </form>
    <form method="post" th:action="@{/logout}">
        <button type="submit">Logout</button>
    </form>
</body>
</html>
